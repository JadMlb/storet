<div class = "stock">
  <stock-tag [status] = "stock?.status"/>
  <span class = "stock-count">{{stock?.quantityInStock ?? "-"}} in stock</span>
  @if (!disableEditing())
  {
    <styled-button
      class = "edit-stock"
      borderRadius = "xsmall"
      paddingInline = "small"
      [disabled] = "!stock"
      (onClick) = "openEditDialog ($event)"
    >
      Edit bounds
    </styled-button>
  }
</div>

@if (!disableEditing())
{
  <inventory-bounds-editor
    [open] = "editDialogOpen()"
    [itemId] = "itemId()"
    [itemName] = "itemName()"
    (onClose) = "closeDialog()"
    (onSave) = "saveData ($event)"
    [bounds] = "stock"
  />
}
