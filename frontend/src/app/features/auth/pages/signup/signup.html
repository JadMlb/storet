<auth-base
  [confirmPassword] = "true"
  [error] = "error()"
  (onSubmit) = "handleSubmission ($event)"
  (onSecondaryNavigation) = "handleSecondaryNavigation()"
>
  <span title>Sign up</span>
  <p class = "subtitle" subtitle>Start organizing your life with Storet</p>
  <span primary-button-content>Create an account</span>
  <span secondary-text>Already have an account?</span>
  <span secondary-button-content>Log in with an existing account</span>
</auth-base>
