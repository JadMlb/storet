<button
	class = "button"
	[class.border-xsmall] = "smallerBorderRadius"
	[class.padding-xsmall] = "smallerPadding"
	[class.fill] = "fill"
	[class.filled] = "renderStyle === 'filled'"
	[class.outlined] = "renderStyle === 'outlined'"
	[class.primary] = "role === 'primary'"
	[class.normal] = "role === 'normal'"
	[class.warn] = "role === 'warn'"
	[class.disabled] = "disabled"
	[attr.form] = "form"
	[disabled] = "disabled"
	[type] = "type"
	(click) = "handleClick ($event)"
>
	<ng-content/>
</button>
