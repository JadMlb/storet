<section>
	<header class = "list-view-header">
		<h1><ng-content select = "[header-title-contents]"/></h1>
		<styled-button
			class = "cta"
			role = "primary"
			[borderRadius] = "buttonBorder()"
			[paddingInline] = "buttonInlinePadding()"
			[paddingBlock] = "buttonBlockPadding()"
			(onClick) = "handleCreateRequest()"
		>
			<plus/>
			@if (responsiveness.isDesktop())
			{
				<ng-content select = "[header-button-contents]"/>
			}
		</styled-button>
	</header>
	<ng-content/>
</section>
<ng-content select = "[drawer]"/>
