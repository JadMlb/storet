<div class = "input-wrapper">
  <field-label [required] = "isRequired" [text] = "label"/>
	<div class = "input">
  	<input
  		[class.disabled] = "disabled"
  		[type] = "inputType()"
  		[placeholder] = "placeholder"
  		[value] = "value"
  		(input) = "onInput ($event)"
  		(blur) = "onBlur()"
  		[disabled] = "disabled"
   	/>
    <button (click) = "toggleVisibility ($event)"><eye [closed] = "valueShown()"/></button>
  </div>
</div>
