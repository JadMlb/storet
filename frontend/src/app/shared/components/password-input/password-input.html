<input-base [required] = "isRequired" [label] = "label()" [disabled] = "disabled">
	<input
		input
		[type] = "inputType()"
		[placeholder] = "placeholder()"
		[value] = "value"
		(input) = "onInput ($event)"
		(blur) = "onBlur()"
		[disabled] = "disabled"
	/>
	<button
		trailing
		(click) = "toggleVisibility ($event)"
	>
		<eye [closed] = "valueShown()"/>
	</button>
</input-base>
