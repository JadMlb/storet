<div class = "input-wrapper">
	@if (label)
	{
		<label [class.required] = "isRequired">{{label}}</label>
	}
	<div
	  class = "input"
		[class.disabled] = "disabled()"
	>
	  @if (!disabled())
		{
   	  <button
        (click) = "decrement ($event)"
        [disabled] = "decrementDisabled()"
        [class.disabled] = "decrementDisabled()"
      >
        -
      </button>
		}
  	<input
  		type = "number"
  		[value] = "value()"
  		(input) = "onInput ($event)"
  		(blur) = "onBlur()"
  		[disabled] = "disabled()"
   	/>
    @if (!disabled())
    {
      <button
        (click) = "increment ($event)"
        [disabled] = "incrementDisabled()"
        [class.disabled] = "incrementDisabled()"
      >
        +
      </button>
    }
	</div>
</div>
