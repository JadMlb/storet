<div class = "input-wrapper">
	@if (label)
	{
		<label [class.required] = "isRequired">{{label}}</label>
	}
	<input
		[class.disabled] = "disabled"
		type = "text"
		[placeholder] = "placeholder"
		[value] = "value"
		(input) = "onInput ($event)"
		(blur) = "onBlur()"
		[disabled] = "disabled"
	/>
</div>
