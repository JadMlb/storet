<field-label text = "Theme"/>
<form [formGroup] = "form">
	<label>
		<input
			type = "radio"
			value = "auto"
			formControlName = "theme"
		/>
		Auto
	</label>
	<label>
		<input
			type = "radio"
			value = "light"
			formControlName = "theme"
		/>
		Light
	</label>
	<label>
		<input
			type = "radio"
			value = "dark"
			formControlName = "theme"
		/>
		Dark
	</label>
</form>
