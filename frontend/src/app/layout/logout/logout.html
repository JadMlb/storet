<button
  class = "logout"
  (click) = "toggleMenuOpen()"
>
  {{userInitial()}}
</button>

@if (menuOpen())
{
  <div class = "menu" animate.enter = "enter" animate.leave = "leave">
    {{user()}}
    <styled-button
      role = "warn"
      [fill] = "true"
      (onClick) = "logout()"
    >
      Log out
    </styled-button>
  </div>
}
