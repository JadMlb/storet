<article>
	<header class = "categories-header">
		<h1>Categories</h1>
		<styled-button
			role = "primary"
			(onClick) = "navigateToNew()"
		>
			+ New Category
		</styled-button>
	</header>
	<suspense [loading] = "categoriesStore.state() == 'loading'">
		@for (category of categoriesStore.data(); track category.id)
		{
			<category
				[id] = "category.id"
				[label] = "category.label"
				[children] = "category.children"
				(onClick) = "navigateToDetails ($event)"
			/>
		}
	</suspense>
</article>
<router-outlet/>
