<list-view
  (onCreateRequest) = "navigateToNew()"
>
  <span header-title-contents>Categories</span>
  <span header-button-contents>+ New Category</span>
  <suspense [loading] = "categoriesStore.state() == 'loading'">
		@for (category of categoriesStore.data(); track category.id)
		{
			<category
				[id] = "category.id"
				[label] = "category.label"
				[children] = "category.children"
				(onClick) = "navigateToDetails ($event)"
			/>
		}
		@empty
		{
			<p>Looks like you don't have any category defined. Categories are essential to organize your items.</p>
			<styled-button
				role = "primary"
				(onClick) = "navigateToNew()"
			>
				Start by adding a new category
			</styled-button>
		}
	</suspense>
</list-view>
